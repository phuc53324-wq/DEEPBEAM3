<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepBeam STM – Sức kháng cắt dầm cao có lỗ mở</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-step="1">

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 36 36" aria-hidden="true">
      <rect x="2" y="7" width="32" height="20" rx="2" fill="#1f6feb"/>
      <rect x="8" y="13" width="8" height="6" fill="#0d2137"/>
      <rect x="20" y="13" width="8" height="6" fill="#0d2137"/>
      <path d="M5 23h26" stroke="#ff6b6b" stroke-width="2"/>
      <path d="M6 27l-3 5h6zM30 27l-3 5h6z" fill="#cbd5e1"/>
    </svg>
    <div>
      <div class="brand-name">DeepBeam<span>STM</span></div>
      <div class="brand-sub">Sức kháng cắt dầm cao BTCT có lỗ mở</div>
    </div>
  </div>

  <div class="project">
    <label><span>Dự án</span><input type="text" data-k="projName" autocomplete="off"></label>
    <label><span>Cấu kiện</span><input type="text" data-k="memberName" autocomplete="off"></label>
  </div>

  <div class="actions">
    <div class="sel-wrap">
      <select id="presetSel" title="Nạp dữ liệu dầm thí nghiệm mẫu">
        <option value="">Nạp dầm mẫu…</option>
        <optgroup label="Rajprabhu & Appa Rao (2026)">
          <option>DBSO-0.75-0.30</option>
          <option>DBSO-0.75-0.40</option>
          <option>DBLO-0.75-0.30</option>
          <option>DBLO-0.75-0.40</option>
          <option>DBSO-1.50-0.30</option>
          <option>DBSO-1.50-0.40</option>
          <option>DBLO-1.50-0.30</option>
          <option>DBLO-1.50-0.40</option>
        </optgroup>
      </select>
    </div>
    <button class="btn ghost" id="btnOpen" title="Mở tệp dữ liệu (.json)">
      <svg viewBox="0 0 16 16"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z"/></svg>Mở</button>
    <button class="btn ghost" id="btnSave" title="Lưu dữ liệu nhập ra tệp (.json)">
      <svg viewBox="0 0 16 16"><path d="M3 2.5h8l2 2v9H3z M5.5 2.5v3h5v-3 M5 13.5v-4h6v4"/></svg>Lưu</button>
    <button class="btn ghost" id="btnReset" title="Khôi phục dữ liệu mặc định">
      <svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5v3h3"/></svg>Đặt lại</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</header>

<nav class="stepper" id="stepper" aria-label="Tiến trình">
  <button class="step" data-go="1"><span class="num"><span class="n">1</span><svg class="ck" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
    <span class="lbl"><span class="t">Tiêu chuẩn &amp; phương pháp</span><span class="st">Mô hình tính, hệ số β</span></span></button>
  <span class="step-line" data-line="1"><i></i></span>
  <button class="step" data-go="2"><span class="num"><span class="n">2</span><svg class="ck" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
    <span class="lbl"><span class="t">Hình học &amp; tải trọng</span><span class="st">Dầm, gối, lỗ mở</span></span></button>
  <span class="step-line" data-line="2"><i></i></span>
  <button class="step" data-go="3"><span class="num"><span class="n">3</span><svg class="ck" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
    <span class="lbl"><span class="t">Vật liệu &amp; cốt thép</span><span class="st">Bê tông, thép dọc, thép bụng</span></span></button>
  <span class="step-line" data-line="3"><i></i></span>
  <button class="step" data-go="4"><span class="num"><span class="n">4</span><svg class="ck" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span>
    <span class="lbl"><span class="t">Kết quả</span><span class="st">Tổng hợp sức kháng cắt</span></span></button>
</nav>

<main class="workspace">
  <section class="panel form-panel">
    <div class="panel-head">
      <div class="ph-step" id="phStep">BƯỚC 1</div>
      <h2 id="stepTitle"></h2>
      <p id="stepDesc"></p>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="step-pane" data-pane="1" id="pane1"></div>
      <div class="step-pane" data-pane="2" id="pane2"></div>
      <div class="step-pane" data-pane="3" id="pane3"></div>
      <div class="step-pane" data-pane="4" id="pane4"></div>
    </div>
    <div class="validation" id="validation"></div>
    <footer class="panel-foot">
      <button class="btn" id="btnPrev"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>Quay lại</button>
      <span class="foot-info"><span id="footStep">Bước 1 / 4</span><span class="autosave" id="autosave">Tự động lưu</span></span>
      <button class="btn primary" id="btnNext">Tiếp theo<svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
    </footer>
  </section>

  <section class="panel viz-panel">
    <div class="viz-toolbar">
      <div class="viz-title">Mặt đứng dầm <small id="vizScale"></small></div>
      <div class="layer-toggles" role="group" aria-label="Lớp hiển thị">
        <label class="tgl"><input type="checkbox" id="lyDim" checked><span>Kích thước</span></label>
        <label class="tgl"><input type="checkbox" id="lyRebar" checked><span>Cốt thép</span></label>
        <label class="tgl"><input type="checkbox" id="lyStm"><span>Mô hình giàn ảo</span></label>
      </div>
    </div>
    <div class="elev-wrap" id="elevWrap"><svg id="elev" role="img" aria-label="Hình minh họa mặt đứng dầm"></svg></div>
    <div class="viz-bottom">
      <div class="section-card">
        <div class="card-title">Mặt cắt 1–1 <small>qua tâm lỗ mở</small></div>
        <div class="sect-wrap"><svg id="sect" role="img" aria-label="Mặt cắt ngang dầm"></svg></div>
      </div>
      <div class="info-card">
        <div class="card-title">Thông số chính</div>
        <div class="chips" id="chips"></div>
        <div class="legend">
          <span><i class="lg-conc"></i>Bê tông</span>
          <span><i class="lg-hole"></i>Lỗ mở</span>
          <span><i class="lg-line" style="--c:var(--r-bot)"></i>Thép chịu kéo</span>
          <span><i class="lg-line" style="--c:var(--r-top)"></i>Thép cấu tạo trên</span>
          <span><i class="lg-line" style="--c:var(--r-h)"></i>Thép bụng ngang</span>
          <span><i class="lg-line" style="--c:var(--r-v)"></i>Cốt đai đứng</span>
          <span><i class="lg-line" style="--c:var(--r-trim)"></i>Gia cường lỗ</span>
          <span><i class="lg-dash" style="--c:var(--stm)"></i>Thanh chống</span>
          <span><i class="lg-line" style="--c:var(--tie)"></i>Thanh giằng</span>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/drawing.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
